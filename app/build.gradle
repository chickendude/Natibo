plugins {
	id 'com.android.application'
	id 'kotlin-android'
	id 'kotlin-parcelize'
	id "com.google.dagger.hilt.android" version "$hilt_version"
	id "org.jetbrains.kotlin.plugin.compose" version "$kotlin_version" // this version matches your Kotlin version
	id 'com.google.devtools.ksp' version '2.1.21-2.0.1'
}

android {
	compileSdkVersion = 36
	buildToolsVersion = '35.0.0'
	defaultConfig {
		applicationId = "ch.ralena.natibo"
		minSdkVersion 21
		targetSdkVersion 36
		versionCode = 35
		versionName = "0.4.1"

		testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
	}
	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_1_8
		targetCompatibility = JavaVersion.VERSION_1_8
	}
	buildFeatures {
		viewBinding = true
		compose = true
	}
	buildTypes {
		release {
			minifyEnabled = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
		debug {
			applicationIdSuffix = '.debug'
			versionNameSuffix = '-DEBUG '
		}
	}
	composeOptions {
		kotlinCompilerExtensionVersion = '1.5.1'
	}
	kotlinOptions {
		jvmTarget = '1.8'
	}
	namespace = 'ch.ralena.natibo'
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation "androidx.activity:activity-compose:1.10.1"
	implementation "androidx.appcompat:appcompat:1.7.1"
	implementation "androidx.cardview:cardview:1.0.0"
	implementation "androidx.compose.animation:animation:1.9.0"
	implementation "androidx.compose.material:material:1.9.0"
	implementation "androidx.compose.ui:ui-tooling:1.9.0"
	implementation "androidx.navigation:navigation-compose:2.9.3"
	implementation "androidx.constraintlayout:constraintlayout:2.2.1"
	implementation "androidx.core:core-ktx:1.17.0"
	implementation "androidx.fragment:fragment-ktx:1.8.9"
	implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
	implementation "androidx.hilt:hilt-work:1.2.0"
	implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.2"
	implementation "androidx.lifecycle:lifecycle-service:2.9.2"
	implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2"
	implementation "androidx.media:media:1.7.1"
	implementation "androidx.recyclerview:recyclerview:1.4.0"
	implementation "androidx.room:room-ktx:$room_version"
	implementation "androidx.room:room-runtime:$room_version"
	implementation "androidx.work:work-runtime-ktx:2.10.3"
	implementation "com.google.android.material:material:1.12.0"
	implementation "com.google.dagger:hilt-android:$hilt_version"
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
	implementation "com.squareup:javapoet:1.13.0"
	ksp "androidx.hilt:hilt-compiler:1.2.0"
    ksp "androidx.room:room-compiler:$room_version"
	ksp "com.google.dagger:hilt-android-compiler:$hilt_version"
	// https://issuetracker.google.com/issues/236612358#comment11
	ksp "org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0"
	testImplementation 'io.kotest:kotest-assertions-core:5.9.1'
	testImplementation "io.mockk:mockk:1.14.5"
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
	testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
	androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.9.0'
}
hilt {
	enableAggregatingTask = false
}
repositories {
	mavenCentral()
}
